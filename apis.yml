aid: segway-ninebot
name: Segway-Ninebot
description: 'Segway-Ninebot is a global personal-transportation and robotics company,
  formed when Ninebot acquired Segway in 2015. It designs and manufactures electric
  kickscooters (the world''s top-selling e-kickscooter brand, 13M+ units sold across
  100+ countries), self-balancing personal transporters, e-bikes, and — through its
  Robotics division — RMP mobile-robot chassis and delivery/service robots (Nova Carter,
  NVIDIA Isaac-powered developer kits). Backed by HongShan. Its public developer surface
  is limited to Segway Robotics'' open-source ROS / NVIDIA Isaac integration packages
  on GitHub; no first-party REST or OpenAPI product API is currently published.'
